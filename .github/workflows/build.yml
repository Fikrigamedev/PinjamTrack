name: Build APK

# Taruh file ini di: .github/workflows/build-apk.yml
# Taruh pinjamtrack.html di root repo, lalu push ke branch main/master.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan project Capacitor
        run: |
          test -f pinjamtrack.html || { echo "pinjamtrack.html tidak ada di root repo"; exit 1; }
          mkdir -p www
          cp pinjamtrack.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          echo '{"appId":"com.caxastudio.pinjamtrack","appName":"PinjamTrack","webDir":"www"}' > capacitor.config.json

      - name: Build Tailwind (agar bisa offline)
        run: |
          npx -y tailwindcss@3.4.17 -o www/tailwind.css --content ./www/index.html --minify
          sed -i 's#<script src="https://cdn.tailwindcss.com"></script>#<link rel="stylesheet" href="tailwind.css">#' www/index.html
          grep -q 'href="tailwind.css"' www/index.html

      - name: Tambah platform Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinjamTrack-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
